# The matrix the harden-tests directive parked: both OSes x both
# interpreters the venvs cover. pywin32 is deliberately not installed --
# the runners have no Office, so the two finish smokes (wordreport,
# pptx simple) take the designed no-pywin32 path and report xfailed;
# everything else must pass everywhere.
name: test

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.10', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e .[test,dates]
      - name: Run the suite
        working-directory: tests
        run: python -m pytest -q
