[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "Scriptum-Report"
version = "1.2.1"
description = "Generate DOCX and PPTX reports from templates using python-docx and python-pptx."
readme = "README.md"
requires-python = ">=3.10"
license = "PolyForm-Noncommercial-1.0.0 OR LicenseRef-SCRIPTUM-Commercial"
license-files = ["LICENSE.md", "LICENSES/*"]
authors = [
  { name = "Thomas Emmel", email = "temmel007@gmail.com" }
]
dependencies = [
  "python-docx>=1.2.00",
  "python-pptx>=1.0.00",
  "Pillow>=10.0.0"
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Intended Audience :: Developers",
  "Topic :: Office/Business",
  "Topic :: Software Development :: Libraries"
]

[project.optional-dependencies]
# Running the test suite.
test = ["pytest>=7.0"]
# Windows-only finishing: refresh fields/TOC and export PDF via a running Office.
# Imported conditionally (os.name == 'nt'), so the package works without it.
windows = ["pywin32>=306"]
# Richer date parsing. Without it DateValue falls back to a bundled minimal
# parser that understands fewer formats, so date handling differs between
# environments unless this is installed.
dates = ["python-dateutil>=2.8.2"]
# Everything needed to develop and test this package on Windows.
dev = ["pytest>=7.0", "pywin32>=306", "python-dateutil>=2.8.2"]

[tool.setuptools]
script-files = [ "scripts/convert_video.sh", "scripts/convert_video.py", "scripts/check_docx.py",
                 "scripts/check_pptx.py", "scripts/check_rdf.py" ]

[tool.setuptools.packages.find]
include = ["Scriptum*", "CHANGELOG", "docs"]
exclude = ["tests**","tests*","*tests*"]
